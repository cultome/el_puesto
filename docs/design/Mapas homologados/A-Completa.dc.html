<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>A · Circuito a pantalla completa</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141720}
a{color:#F2B134;text-decoration:none}a:hover{color:#F6BB45}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #1D2029; font-family: 'IBM Plex Sans', sans-serif; color: #ECEEF2">
<div style="position: absolute; left: 0; top: 0">
<dc-import name="MapaTrazado" w="{{w}}" h="{{h}}" radius="{{0}}" border-w="{{0}}" puestos="{{on.P}}" rescate="{{on.R}}" soporte="{{on.S}}" medicos="{{on.M}}" selected="{{sel}}" on-pick="{{pick}}" controls-bottom="{{28}}" paleta="{{paleta}}" hint-size="390px,844px"></dc-import>
</div>
<div style="position: absolute; left: 0; top: 0; width: 390px; box-sizing: border-box; padding: 12px 16px 0 16px; display: flex; align-items: center; gap: 12px">
<a href="A-Circuito.dc.html" aria-label="Regresar" style="width: 42px; height: 42px; flex-shrink: 0; box-sizing: border-box; border-radius: 12px; background: rgba(42,46,57,0.94); border: 1px solid #3A4152; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ECEEF2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div style="flex-grow: 1; min-width: 0; padding: 5px 12px; box-sizing: border-box; border-radius: 12px; background: rgba(36,40,51,0.9); display: flex; flex-direction: column">
<div style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 9.5px; letter-spacing: 1px; color: #F2B134">GRAN PREMIO</div>
<div style="font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 13px; color: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Autódromo Hermanos Rodríguez</div>
</div>
<a href="A-Circuito.dc.html" aria-label="Salir de pantalla completa" style="width: 42px; height: 42px; flex-shrink: 0; box-sizing: border-box; border-radius: 12px; background: rgba(36,40,51,0.94); border: 1px solid #3A4152; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ECEEF2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"></path></svg></a>
</div>
<div style="position: absolute; left: 16px; top: 66px">
<dc-import name="BarraCapas" w="{{barW}}" overlay="{{true}}" puestos="{{on.P}}" rescate="{{on.R}}" soporte="{{on.S}}" medicos="{{on.M}}" counts="{{counts}}" on-toggle="{{toggle}}" paleta="{{paleta}}" hint-size="358px,66px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"paleta":{"editor":"enum","default":"Contorno (propuesta)","options":["Contorno (propuesta)","Rellenos (anterior)"],"section":"Colores"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const on = st.on || { P: true, R: true, S: true, M: true };
    return {
      on,
      sel: st.sel ?? 'IFRT4',
      paleta: this.props.paleta ?? 'Contorno (propuesta)',
      w: 390,
      h: 844,
      barW: 358,
      counts: { P: 15, R: 6, S: 2, M: 2 },
      toggle: (k) => this.setState({ on: Object.assign({}, on, { [k]: !on[k] }) }),
      pick: (label) => this.setState({ sel: label }),
    };
  }
}
</script>
</body>
</html>
