[versions]
kotlin = "2.3.21"
agp = "8.7.2"
coreKtx = "1.13.1"
activityCompose = "1.9.2"
lifecycle = "2.8.6"
composeBom = "2024.09.03"
serialization = "1.9.0"
# 0.7.x con las clases de 0.6 (Instant/Clock de kotlinx.datetime): material3 web exige 0.7.1 y
# :shared/backend usan la API de 0.6. Migrar a kotlin.time.Instant permitiría la 0.7 normal.
datetime = "0.7.1-0.6.x-compat"
ktor = "2.3.12"
# Cliente HTTP de la app (Android + web): Ktor 3 (el 2 no tiene target wasm). El backend sigue en Ktor 2.
ktorClient = "3.3.3"
# Compose Multiplatform (UI compartida Android + web). 1.11.x = AndroidX Compose 1.11 (compileSdk 35, AGP ≥ 8.6).
composeMultiplatform = "1.11.1"
composeMaterial3 = "1.9.0"
jbLifecycle = "2.9.6"
coroutines = "1.10.2"
logback = "1.5.7"
sqldelight = "2.0.2"
exposed = "0.55.0"
postgres = "42.7.4"
hikari = "5.1.0"
jakartaMail = "2.0.1"
jsoup = "1.23.2"
imageCropper = "4.6.0"
playServicesLocation = "21.3.0"
compileSdk = "35"
minSdk = "26"
targetSdk = "35"

[libraries]
